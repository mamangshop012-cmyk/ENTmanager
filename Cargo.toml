[package]
name = "managerRUSTent"
version = "0.1.0"
edition = "2021"

[dependencies]
teloxide = { version = "0.13", features = ["macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
pretty_env_logger = "0.5"
log = "0.4"
dotenvy = "0.15"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio-native-tls"] }
regex = "1.10"
chrono = "0.4"
serde_json = "1.0.151"
reqwest = { version = "0.12", features = ["json"] }
# Terminal dashboard
ratatui = "0.30"
crossterm = "0.28"
